[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Rewrite API routes to the Express app (serverless-http).
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/webhook/*"
  to = "/.netlify/functions/server"
  status = 200
